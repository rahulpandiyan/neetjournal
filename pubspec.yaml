name: studyn
description: "Studyn — a simple study companion for NEET aspirants."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  drift: ^2.28.0
  drift_flutter: ^0.3.1
  intl: ^0.20.2
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  hugeicons: ^1.1.7
  heroicons: ^0.11.0
  wakelock_plus: ^1.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  drift_dev: ^2.28.0
  build_runner: ^2.4.13
  msix: ^3.18.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/app_logo.png

  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk.ttf
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans.ttf

msix_config:
  display_name: Studyn
  publisher_display_name: NEET Journal
  identity_name: com.neerjournal.studyn
  msix_version: 1.0.0.0
  logo_path: assets/images/app_logo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/images/app_logo.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/images/app_logo.png
